name: Publish image to GHCR

# Builds webapp/Dockerfile and pushes to ghcr.io/bbaldino/diagram-tool.
# No `paths` filter: GitHub ANDs `paths` with tag pushes, which would skip a
# release-tag build whose commit didn't touch webapp/.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# main-push and tag-push are different refs and can run concurrently.
# They write genuinely disjoint tag sets, but ONLY because of the
# enable={{is_default_branch}} on the sha rule below: main writes sha-<short>,
# the tag writes the version tags. Without that flag both runs emit sha-<short>
# and it silently lands on whichever finished last.
# The two runs still build the same commit twice, so sha-<short> and X.Y.Z are
# different digests of identical source. That is expected — verify a release by
# comparing the three version tags to each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: images must never publish from code that fails typecheck or tests.
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # The raw latest rule is deliberately absent. flavor latest=auto
          # already tags latest on non-prerelease semver tags; having both made
          # latest bounce between main and releases.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: webapp
          file: webapp/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
