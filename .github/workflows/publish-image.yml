name: Publish image to GHCR

# Builds webapp/Dockerfile and pushes to ghcr.io/bbaldino/diagram-tool.
# No `paths` filter: GitHub ANDs `paths` with tag pushes, which would skip a
# release-tag build whose commit didn't touch webapp/.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

# Tag-only, deliberately: no `branches: [main]`. A release commit reaches main
# AND a tag, so triggering on both built it twice and had the two runs racing to
# write sha-<short>. Triggering only on the tag means one build per release, and
# X.Y.Z / X.Y / latest / sha-<short> all come from it sharing one digest — so
# verify a release by checking all four agree, and treat a mismatch as a real
# problem rather than an expected artifact.
# Cost: unreleased commits get no image. release-please ignores docs/chore, so
# those are exactly the commits nobody deploys. The test gate is unaffected —
# release-please.yml still runs it on every push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: images must never publish from code that fails typecheck or tests.
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # The raw latest rule is deliberately absent. flavor latest=auto
          # already tags latest on non-prerelease semver tags; having both made
          # latest bounce between main and releases.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: webapp
          file: webapp/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
