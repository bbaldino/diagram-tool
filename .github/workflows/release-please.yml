name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Serialize runs so a post-merge run cannot race the run that spawned it.
# cancel-in-progress MUST be false — cancelling mid-release can interrupt tag
# creation.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: a red main must not cut a release PR either.
  test:
    uses: ./.github/workflows/test.yml

  release-please:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # NOT the default GITHUB_TOKEN: tags it creates do not trigger
          # publish-image.yml, so the release would silently produce no image.
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Deliberately has NO `if:`. Gating on steps.release.outputs.prs_created
      # made this fire only on the run that CREATED the PR: when a merge failed
      # (see below), later runs merely UPDATED the existing PR, prs_created was
      # false, the step was skipped, and the release sat stuck behind an open PR
      # with every run green. Querying for an open release PR instead makes the
      # step idempotent — it merges one if present, exits 0 if not, and so
      # self-heals on the next push after any failure.
      #
      # --repo is REQUIRED on the gh calls: this job has no actions/checkout, so
      # there is no git remote to infer the repo from and gh dies with "fatal:
      # not a git repository". That bug was latent until the first feat:/fix:,
      # because every ci: commit before it left prs_created false and the step
      # never ran at all.
      #
      # The title regex covers both bots: release-please writes
      # "chore(main): release 0.2.1", release-plz "chore: release v0.3.1".
      # `// empty` matters — without it jq prints the literal "null", which
      # would then be passed to gh as a PR number.
      - name: Auto-merge the release PR
        env:
          # Must be RELEASE_BOT_TOKEN: a merge by GITHUB_TOKEN does not trigger
          # the follow-up run that cuts the tag.
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          pr=$(gh pr list --repo "${{ github.repository }}" --state open --json number,title \
                --jq 'map(select(.title | test("^chore(\\(.+\\))?: release "))) | .[0].number // empty')
          if [ -z "$pr" ]; then echo "no open release PR"; exit 0; fi
          gh pr merge --squash --delete-branch --repo "${{ github.repository }}" "$pr"
